<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verdugos Los Santos — Mapa</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <img src="logo.png" alt="Verdugos Los Santos" />
    </div>

    <section class="menu-section">
      <button id="addPointBtn" class="add-point-btn" type="button">
        <span>📍</span> Přidat bod
      </button>

      <div id="pointModeHint" class="point-mode-hint hidden">
        Klikni na místo na mapě pro umístění bodu. ESC zruší režim.
      </div>
      <div class="section-title-row">
        <h2>Kategorie</h2>
        <button id="toggleAllBtn" class="small-action" type="button">
          Skrýt vše
        </button>
      </div>

      <div id="categoryList" class="category-list"></div>

      <button id="addCategoryBtn" class="add-category-btn" type="button">
        <span class="plus">+</span>
        Přidat kategorii
      </button>

      <p class="menu-help">
        Levý klik = zobrazit/skrýt · pravý klik = smazat
      </p>
    </section>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-footer">
      <span>VERDUGOS MC</span>
      <span class="status-dot"></span>
    </div>
  </aside>

  <main class="map-shell">
    <div class="map-toolbar">
      <button id="zoomOut" aria-label="Oddálit" type="button">−</button>
      <button id="resetView" aria-label="Resetovat mapu" type="button">⌂</button>
      <button id="zoomIn" aria-label="Přiblížit" type="button">+</button>
    </div>

    <div id="mapViewport" class="map-viewport">
      <div id="mapCanvas" class="map-canvas">
        <img id="mapImage" src="mapa.png" alt="Mapa Los Santos" draggable="false" />
        <div id="pointsLayer" class="points-layer"></div>
      </div>
    </div>

    <div class="map-hint">Tažením mapu posuneš · kolečkem přiblížíš</div>
  </main>

  <div id="pointModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card point-modal-card" role="dialog" aria-modal="true" aria-labelledby="pointModalTitle">
      <div class="modal-header">
        <h3 id="pointModalTitle">Přidat bod</h3>
        <button id="closePointBtn" class="close-btn" type="button" aria-label="Zavřít">×</button>
      </div>

      <label for="pointName">Název</label>
      <input id="pointName" type="text" maxlength="60" placeholder="Např. Sklad / místo schůzky" autocomplete="off" />

      <label for="pointDescription">Popisek</label>
      <textarea id="pointDescription" class="point-textarea" maxlength="300" placeholder="Krátký popis bodu..."></textarea>

      <label for="pointCategory">Kategorie</label>
      <select id="pointCategory" class="point-select"></select>

      <label>Barva bodu</label>
      <div id="colorPresets" class="color-presets"></div>

      <div class="rgb-row">
        <div class="rgb-field"><label for="redInput">R</label><input id="redInput" type="number" min="0" max="255" value="255" /></div>
        <div class="rgb-field"><label for="greenInput">G</label><input id="greenInput" type="number" min="0" max="255" value="59" /></div>
        <div class="rgb-field"><label for="blueInput">B</label><input id="blueInput" type="number" min="0" max="255" value="48" /></div>
        <div id="colorPreview" class="color-preview" title="Náhled barvy"></div>
      </div>

      <div class="modal-actions">
        <button id="cancelPointBtn" class="secondary-btn" type="button">Zrušit</button>
        <button id="savePointBtn" class="primary-btn" type="button">Přidat bod</button>
      </div>
    </div>
  </div>

  <div id="categoryModal" class="modal hidden" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h3 id="modalTitle">Přidat kategorii</h3>
        <button id="closeCategoryBtn" class="close-btn" type="button" aria-label="Zavřít">×</button>
      </div>

      <label for="categoryName">Název kategorie</label>
      <input
        id="categoryName"
        type="text"
        maxlength="40"
        placeholder="Např. Domy"
        autocomplete="off"
      />

      <div class="modal-actions">
        <button id="cancelCategoryBtn" class="secondary-btn" type="button">
          Zrušit
        </button>
        <button id="saveCategoryBtn" class="primary-btn" type="button">
          Přidat
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
