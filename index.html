<!DOCTYPE html>
<html lang="cs">
<head>
  <link rel="icon" type="image/png" href="logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verdugos MC - Mapa</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: #111; color: #fff; }
    #sidebar { position: fixed; inset: 0 auto 0 0; width: 280px; background:#1a1a1a; padding:20px; overflow-y:auto; z-index:20; border-right:2px solid #222; }
    #sidebar img { display:block; margin:0 auto 10px; max-width:100px; max-height:100px; object-fit:contain; }
    #sidebar h1 { text-align:center; font-size:26px; font-weight:bold; color:red; text-shadow:0 0 10px red; letter-spacing:2px; margin:0 0 10px; }
    #controls input, #controls button { width:100%; margin-bottom:6px; padding:9px; background:#333; color:#fff; border:0; border-radius:5px; }
    #controls input { outline:none; }
    #controls button { cursor:pointer; text-align:center; }
    #controls button:hover { background:#444; }
    .category-header { width:100%; margin:5px 0; padding:9px; background:#333; color:#fff; border:0; font-weight:900; font-size:16px; cursor:pointer; border-radius:6px; }
    .category-header:hover { background:#444; }
    .category-items { margin-left:10px; }
    .item { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:14px; margin:5px 0; padding:5px; cursor:pointer; border-radius:4px; }
    .item:hover { background:rgba(255,255,255,.08); }
    .dot { width:11px; height:11px; border-radius:50%; margin-right:7px; display:inline-block; vertical-align:middle; }
    .delete-btn { color:#aaa; cursor:pointer; }

    #map { position:absolute; left:280px; top:0; right:0; bottom:0; overflow:hidden; background:#000; cursor:grab; transform-origin:0 0; }
    #map-image { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; user-select:none; pointer-events:none; }

    /* Všechny značky jsou skutečně jen malé overlay prvky. Nic nezakrývá celou mapu. */
    .map-overlay-item { position:absolute; }
    .marker { transform:translate(-50%,-50%); border-radius:50%; border:1px solid #fff; cursor:pointer; z-index:30; display:flex; align-items:center; justify-content:center; }
    .marker-icon { line-height:1; pointer-events:none; display:flex; align-items:center; justify-content:center; white-space:nowrap; }
    .polygon-overlay { inset:0; z-index:10; cursor:pointer; }
    .highlight-map-item { animation:pulse .8s infinite; z-index:40 !important; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }
    .polygon-drawing-point { position:absolute; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%; background:cyan; border:2px solid white; z-index:60; pointer-events:none; }

    .tooltip { position:fixed; background:rgba(0,0,0,.85); color:#fff; padding:6px 9px; font-size:12px; border-radius:4px; pointer-events:none; z-index:10000; display:none; white-space:nowrap; }
    #form-wrapper { position:fixed; top:50%; left:calc(50% + 140px); transform:translate(-50%,-50%); width:min(380px,calc(100vw - 40px)); max-height:85vh; overflow:auto; background:#222; padding:20px; border:1px solid #555; border-radius:10px; z-index:20000; color:#fff; box-shadow:0 10px 40px rgba(0,0,0,.65); }
    #form-wrapper input, #form-wrapper textarea { width:100%; color:#fff; background:#111; border:1px solid #555; border-radius:4px; padding:7px; }
    #form-wrapper textarea { min-height:80px; resize:vertical; }
    #form-wrapper button { padding:8px 14px; cursor:pointer; border:0; border-radius:5px; }
    .color-sample { display:inline-block; width:20px; height:20px; border:1px solid #555; margin:2px; }
    @media (max-width:700px) {
      #sidebar { width:230px; }
      #map { left:230px; }
      #form-wrapper { left:50%; }
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <img src="logo.png" alt="Verdugos MC logo">
    <h1>Verdugos MC</h1>
    <div id="controls">
      <input type="text" id="search" placeholder="🔍 Hledat...">
      <button id="show-all" type="button">Zobrazit / Skrýt vše</button>
      <button id="planning-toggle" type="button">📝 Plánovat</button>
    </div>
    <div style="height:20px"></div>
    <div id="menu"></div>
  </div>

  <div id="map">
    <img id="map-image" src="mapa.png" alt="Mapa San Andreas" draggable="false">
  </div>

  <div id="tooltip" class="tooltip"></div>
  <script type="module" src="firebase-map.js"></script>
</body>
</html>
